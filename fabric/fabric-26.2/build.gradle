plugins { id 'net.fabricmc.fabric-loom' version '1.17.11' }
version = '1.4.7-port.1+26.2'
group = 'io.github.kituin'
base { archivesName = 'ChatImage' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.kituin.fun/releases' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.158.0+26.2'
    include implementation('io.github.kituin:ChatImageCode:0.12.2')
    compileOnly 'com.terraformersmc:modmenu:20.0.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE') { rename { "${it}_ChatImage" } } }

// Use the existing HMCL asset cache for local smoke tests without touching its worlds or options.
if (providers.gradleProperty('hmclAssets').isPresent()) {
    loom.runs.client {
        programArgs '--assetsDir', providers.gradleProperty('hmclAssets').get(), '--assetIndex', '32'
    }
}
